<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>双沙盒智能手写板 - 性能优化版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
        }

        #app {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            position: absolute;
            top: env(safe-area-inset-top, 16px);
            left: 16px;
            right: 16px;
            padding: 10px 16px;
            background: #FFF;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 20px 40px -5px rgba(0,0,0,0.12);
            display: flex;
            gap: 16px;
            align-items: center;
            z-index: 999;
            overflow-x: auto;
            scrollbar-width: none;
            touch-action: pan-x;
            -webkit-overflow-scrolling: touch;
        }

        .toolbar::-webkit-scrollbar {
            display: none;
        }

        .group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            padding-right: 12px;
            border-right: 1px solid rgba(0,0,0,0.06);
            transition: all 0.2s ease;
        }

        .group:last-child {
            border-right: none;
            padding-right: 0;
        }

        .group.dragging {
            opacity: 0.6;
            transform: scale(0.98) rotateZ(-2deg);
            box-shadow: 0 8px 16px rgba(37,99,235,0.2);
            border-radius: 8px;
            padding: 8px 12px;
            margin: 0 4px;
        }

        .drag-handle {
            width: 16px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            cursor: grab;
            font-size: 16px;
            font-weight: bold;
            touch-action: none;
            transition: color 0.2s;
        }

        .drag-handle:active {
            cursor: grabbing;
            color: #2563eb;
        }

        button {
            border: none;
            background: rgba(0,0,0,0.04);
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }

        button.active, button.clicking {
            background: #2563eb;
            color: #fff;
            box-shadow: 0 4px 14px rgba(37,99,235,0.4);
        }

        button:active {
            transform: scale(0.92);
        }

        .color {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.8);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s, outline 0.2s;
            flex-shrink: 0;
        }

        .color.active {
            transform: scale(1.2);
            outline: 2px solid #2563eb;
            outline-offset: 2px;
        }

        .size-popup {
            position: fixed;
            z-index: 1001;
            background: #FFF;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 220px;
            opacity: 0;
            transform: scale(0.9) translateY(-8px);
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
            border: 1px solid rgba(0,0,0,0.06);
        }

        .size-popup.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .size-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .size-label {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
        }

        .size-value {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: 700;
            color: #2563eb;
            min-width: 40px;
            text-align: right;
        }

        .size-display {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60px;
            background: rgba(37,99,235,0.08);
            border-radius: 12px;
        }

        .size-preview {
            width: 32px;
            height: 32px;
            background: #2563eb;
            border-radius: 50%;
            transition: all 0.15s;
            box-shadow: 0 4px 12px rgba(37,99,235,0.3);
        }

        .size-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(37,99,235,0.13);
            border-radius: 999px;
            cursor: pointer;
        }

        .size-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #2563eb;
            box-shadow: 0 2px 8px rgba(37,99,235,0.4);
            cursor: pointer;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            z-index: 10;
        }

        .zone-viewport {
            width: 100%;
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.4s;
            /* 【性能優化】啟用 GPU 圖層硬體加速隔離，杜絕重繪引發全頁重排 */
            will-change: transform;
            contain: strict;
        }

        #zone-a.active {
            box-shadow: inset 0 -20px 40px -15px rgba(37,99,235,0.05);
        }

        #zone-b.active {
            box-shadow: inset 0 20px 40px -15px rgba(37,99,235,0.05);
        }

        .resizer-bar {
            width: 100%;
            height: 32px;
            margin: -16px 0;
            z-index: 100;
            cursor: row-resize;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        .resizer-bar::after {
            content: '';
            width: 48px;
            height: 4px;
            background: rgba(37,99,235,0.5);
            border-radius: 999px;
            transition: all 0.25s;
        }

        .resizer-bar.active-drag::after {
            width: 120px;
            height: 8px;
            background: #2563eb;
            box-shadow: 0 0 16px rgba(37,99,235,0.8);
        }

        .smart-mask {
            position: absolute;
            inset: 0;
            z-index: 5;
            backdrop-filter: contrast(90%) brightness(88%);
            -webkit-backdrop-filter: contrast(90%) brightness(88%);
            background: rgba(0,0,0,0.05);
            pointer-events: none;
            transition: opacity 0.25s;
            opacity: 1;
        }

        .zone-viewport.active .smart-mask {
            opacity: 0;
        }

        .canvas-wrapper {
            position: absolute;
            inset: 0;
            z-index: 2;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        @media (max-width: 420px) {
            .size-popup {
                min-width: 180px;
                padding: 14px;
                gap: 10px;
            }
            .size-display {
                height: 50px;
            }
            .size-preview {
                width: 28px;
                height: 28px;
            }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="toolbar" id="mainToolbar">
        <div class="group" id="group-modes">
            <div class="drag-handle">⋮</div>
            <button id="penBtn" class="active">🖊 画笔</button>
            <button id="eraserBtn">🧽 擦除</button>
        </div>

        <div class="group" id="group-colors">
            <div class="drag-handle">⋮</div>
            <button id="sizeBtn">🖌 笔刷</button>
            <div class="color active" data-color="#000000" style="background:#000"></div>
            <div class="color" data-color="#ef4444" style="background:#ef4444"></div>
            <div class="color" data-color="#2563eb" style="background:#2563eb"></div>
            <div class="color" data-color="#16a34a" style="background:#16a34a"></div>
            <div class="color" data-color="#eab308" style="background:#eab308"></div>
            <div class="color" data-color="#ffffff" style="background:#fff; border: 2px solid #ddd;"></div>
        </div>

        <div class="group" id="group-history">
            <div class="drag-handle">⋮</div>
            <button id="undoBtn">↩️ 撤销</button>
            <button id="redoBtn">↪️ 恢复</button>
            <button id="centerBtn">🎯 居中</button>
            <button id="clearBtn">🗑 清空</button>
        </div>

        <div class="group" id="group-controls" style="border-right: none; padding-right: 0;">
            <div class="drag-handle">⋮</div>
            <button id="minimizeBtn" style="background: #f59e0b; color: #fff;">➖ 最小化</button>
            <button id="closeBtn" style="background: #ef4444; color: #fff;">❌ 退出</button>
        </div>
    </div>

    <div class="size-popup" id="sizePopup">
        <div class="size-header">
            <span class="size-label">🖌 笔刷大小</span>
            <span class="size-value"><span id="sizeNum">2</span>px</span>
        </div>
        <div class="size-display">
            <div class="size-preview" id="sizePreview"></div>
        </div>
        <input type="range" class="size-slider" id="sizeSlider" min="0" max="3" value="0" step="1" aria-label="笔刷大小" />
    </div>

    <div class="main-container" id="mainContainer">
        <div id="zone-a" class="zone-viewport active">
            <div class="smart-mask"></div>
            <div class="canvas-wrapper"><canvas id="canvas-a"></canvas></div>
        </div>

        <div class="resizer-bar" id="resizerBar"></div>

        <div id="zone-b" class="zone-viewport">
            <div class="smart-mask"></div>
            <div class="canvas-wrapper"><canvas id="canvas-b"></canvas></div>
        </div>
    </div>
</div>

<script>
    const CONFIG = {
        DPR: Math.min(window.devicePixelRatio || 1, 2),
        SIZE_STEPS: [2, 4, 8, 16],
        ZONE_IDS: ['a', 'b'],
    };

    const DOM = {
        penBtn: document.getElementById('penBtn'),
        eraserBtn: document.getElementById('eraserBtn'),
        undoBtn: document.getElementById('undoBtn'),
        redoBtn: document.getElementById('redoBtn'),
        centerBtn: document.getElementById('centerBtn'),
        clearBtn: document.getElementById('clearBtn'),
        sizeBtn: document.getElementById('sizeBtn'),
        minimizeBtn: document.getElementById('minimizeBtn'),
        closeBtn: document.getElementById('closeBtn'),
        mainToolbar: document.getElementById('mainToolbar'),
        resizerBar: document.getElementById('resizerBar'),
        sizePopup: document.getElementById('sizePopup'),
        sizeSlider: document.getElementById('sizeSlider'),
        sizeNum: document.getElementById('sizeNum'),
        sizePreview: document.getElementById('sizePreview'),
        colorGroup: document.getElementById('group-colors'),
    };

    const STATE = {
        mode: 'pen',
        color: '#000000',
        size: 2,
        ratio: 0.618,
        activeZone: 'a',
        popupVisible: false,
    };

    const DRAG = {
        isDragging: false,
        group: null,
        startX: 0,
        pointerId: null,
        moved: false,
    };

    function createZone(id) {
        return {
            id,
            canvas: document.getElementById(`canvas-${id}`),
            ctx: document.getElementById(`canvas-${id}`).getContext('2d', { desynchronized: true }), // 【優化】開啟低延遲渲染節流
            strokes: [],
            undoStack: [],
            redoStack: [],
            current: null,
            scale: 1,
            offsetX: 0,
            offsetY: 0,
            pointers: new Map(),
            isDrawing: false,
            drawingId: null,
            touchStart: null,
            pinchDist: 0,
            pinchScale: 1,
            pinchCenter: {},
            pinchOffset: {},
            eraserCursor: null,
        };
    }

    const ZONES = Object.fromEntries(CONFIG.ZONE_IDS.map(id => [id, createZone(id)]));

    const Utils = {
        dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),

        pointToLine: (px, py, x1, y1, x2, y2) => {
            const t = Math.max(0, Math.min(1, ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / ((x2 - x1) ** 2 + (y2 - y1) ** 2)));
            return Utils.dist(px, py, x1 + t * (x2 - x1), y1 + t * (y2 - y1));
        },

        screenToWorld: (x, y, zone) => {
            const rect = zone.canvas.getBoundingClientRect();
            return {
                x: (x - rect.left - zone.offsetX) / zone.scale,
                y: (y - rect.top - zone.offsetY) / zone.scale,
            };
        },

        resetAllStates: () => {
            CONFIG.ZONE_IDS.forEach(id => {
                const z = ZONES[id];
                z.isDrawing = z.drawingId = z.touchStart = z.eraserCursor = z.current = null;
                z.pointers.clear();
                Render.request(z);
            });
            document.querySelectorAll('.toolbar .group.dragging').forEach(el => el.classList.remove('dragging'));
        },
    };

    // ============================================
    // 繪製系統（高併發性能優化版）
    // ============================================
    const Render = {
        // 【核心優化】使用 Set 代替原有 flags 物件，集中管理同一幀內需要重繪的沙盒
        dirtyZones: new Set(),
        rafId: null,

        stroke: (ctx, stroke, zone) => {
            if (!stroke?.points?.length) return;
            ctx.save();
            ctx.lineCap = ctx.lineJoin = 'round';
            ctx.strokeStyle = stroke.color;
            ctx.lineWidth = stroke.size;
            ctx.beginPath();
            if (stroke.points.length === 1) {
                const p = stroke.points[0];
                ctx.arc(p.x, p.y, stroke.size / 2, 0, Math.PI * 2);
                ctx.fillStyle = stroke.color;
                ctx.fill();
            } else {
                ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
                const len = stroke.points.length;
                for (let i = 1; i < len - 1; i++) {
                    const xc = (stroke.points[i].x + stroke.points[i + 1].x) / 2;
                    const yc = (stroke.points[i].y + stroke.points[i + 1].y) / 2;
                    ctx.quadraticCurveTo(stroke.points[i].x, stroke.points[i].y, xc, yc);
                }
                ctx.lineTo(stroke.points[len - 1].x, stroke.points[len - 1].y);
                ctx.stroke();
            }
            ctx.restore();
        },

        eraserCursor: (ctx, zone) => {
            if (STATE.mode !== 'eraser' || !zone.eraserCursor) return;
            const radius = (STATE.size * 2.5) / zone.scale;
            ctx.strokeStyle = 'rgba(37,99,235,0.75)';
            ctx.lineWidth = 1.5 / zone.scale;
            ctx.setLineDash([4 / zone.scale, 3 / zone.scale]);
            ctx.beginPath();
            ctx.arc(zone.eraserCursor.x, zone.eraserCursor.y, radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = 'rgba(37,99,235,0.08)';
            ctx.fill();
        },

        // 異步排程整合器：防止多點觸控時的高頻率重繪堆疊
        request: (zone) => {
            Render.dirtyZones.add(zone);
            if (!Render.rafId) {
                Render.rafId = requestAnimationFrame(Render.flush);
            }
        },

        flush: () => {
            Render.rafId = null;
            Render.dirtyZones.forEach(zone => {
                const ctx = zone.ctx;
                ctx.clearRect(0, 0, zone.canvas.width, zone.canvas.height);
                ctx.save();
                ctx.scale(CONFIG.DPR, CONFIG.DPR);
                ctx.translate(zone.offsetX, zone.offsetY);
                ctx.scale(zone.scale, zone.scale);

                // 傳統 for 迴圈性能優於 forEach 遍歷
                const len = zone.strokes.length;
                for (let i = 0; i < len; i++) {
                    Render.stroke(ctx, zone.strokes[i], zone);
                }
                if (zone.current) Render.stroke(ctx, zone.current, zone);
                Render.eraserCursor(ctx, zone);
                ctx.restore();
            });
            Render.dirtyZones.clear();
        },
    };

    const Edit = {
        finish: (zone) => {
            if (!zone.current) return;
            zone.strokes.push(zone.current);
            zone.undoStack.push({ type: 'add', stroke: zone.current });
            zone.redoStack = [];
            zone.current = null;
            Render.request(zone);
        },

        erase: (point, zone) => {
            const radius = (STATE.size * 2.5) / zone.scale;
            let changed = false;
            for (let i = zone.strokes.length - 1; i >= 0; i--) {
                const stroke = zone.strokes[i];
                if (!stroke.points.length) continue;

                const xs = stroke.points.map(p => p.x);
                const ys = stroke.points.map(p => p.y);
                const minX = Math.min(...xs);
                const maxX = Math.max(...xs);
                const minY = Math.min(...ys);
                const maxY = Math.max(...ys);
                if (point.x < minX - radius || point.x > maxX + radius || point.y < minY - radius || point.y > maxY + radius) continue;

                let shouldRemove = stroke.points.length === 1 && Utils.dist(point.x, point.y, stroke.points[0].x, stroke.points[0].y) <= radius;
                if (!shouldRemove) {
                    for (let j = 0; j < stroke.points.length - 1; j++) {
                        if (Utils.pointToLine(point.x, point.y, stroke.points[j].x, stroke.points[j].y, stroke.points[j + 1].x, stroke.points[j + 1].y) <= radius) {
                            shouldRemove = true;
                            break;
                        }
                    }
                }

                if (shouldRemove) {
                    const removed = zone.strokes.splice(i, 1)[0];
                    zone.undoStack.push({ type: 'erase', stroke: removed, index: i });
                    zone.redoStack = [];
                    changed = true;
                }
            }
            if (changed) Render.request(zone);
        },

        undo: () => {
            const z = ZONES[STATE.activeZone];
            if (!z.undoStack.length) return;
            const action = z.undoStack.pop();
            z.redoStack.push(action);
            if (action.type === 'add') z.strokes.pop();
            else if (action.type === 'erase') z.strokes.splice(action.index, 0, action.stroke);
            else z.strokes = [...action.oldStrokes];
            Render.request(z);
        },

        redo: () => {
            const z = ZONES[STATE.activeZone];
            if (!z.redoStack.length) return;
            const action = z.redoStack.pop();
            z.undoStack.push(action);
            if (action.type === 'add') z.strokes.push(action.stroke);
            else if (action.type === 'erase') z.strokes.splice(action.index, 1);
            else z.strokes = [];
            Render.request(z);
        },

        center: () => {
            const z = ZONES[STATE.activeZone];
            z.scale = 1;
            z.offsetX = z.offsetY = 0;
            Render.request(z);
        },

        clear: () => {
            const z = ZONES[STATE.activeZone];
            if (!z.strokes.length) return;
            z.undoStack.push({ type: 'clear', oldStrokes: [...z.strokes] });
            z.redoStack = [];
            z.strokes = [];
            Render.request(z);
        },
    };

    const UI = {
        updateSize: (idx) => {
            STATE.size = CONFIG.SIZE_STEPS[idx];
            DOM.sizeNum.textContent = STATE.size;
            DOM.sizeSlider.value = idx;
            DOM.sizePreview.style.width = DOM.sizePreview.style.height = `${20 + STATE.size * 2}px`;
        },

        showSizePopup: () => {
            const rect = DOM.colorGroup.getBoundingClientRect();
            DOM.sizePopup.style.top = `${rect.bottom + 12}px`;
            DOM.sizePopup.style.left = `${Math.max(16, Math.min(rect.left, window.innerWidth - 240))}px`;
            DOM.sizePopup.classList.add('visible');
            STATE.popupVisible = true;
        },

        hideSizePopup: () => {
            DOM.sizePopup.classList.remove('visible');
            STATE.popupVisible = false;
        },

        resizeCanvas: () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const ha = h * STATE.ratio;
            const hb = h * (1 - STATE.ratio);
            document.getElementById('zone-a').style.flex = `0 0 ${ha}px`;
            document.getElementById('zone-b').style.flex = `0 0 ${hb}px`;
            CONFIG.ZONE_IDS.forEach(id => {
                const z = ZONES[id];
                const tz = id === 'a' ? ha : hb;
                z.canvas.width = w * CONFIG.DPR;
                z.canvas.height = tz * CONFIG.DPR;
                z.canvas.style.width = `${w}px`;
                z.canvas.style.height = `${tz}px`;
                Render.request(z);
            });
        },
    };

    function setupCanvasEvents(zone) {
        const el = zone.canvas;

        // 點擊判定切換與初始點記錄
        el.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'pen' || (e.pointerType === 'touch' && zone.pointers.size === 0)) {
                window.switchActiveZone(zone.id);
            }
            zone.pointers.set(e.pointerId, e);

            if (e.pointerType === 'pen') {
                el.setPointerCapture(e.pointerId);
                const world = Utils.screenToWorld(e.clientX, e.clientY, zone);
                zone.isDrawing = true;
                zone.drawingId = e.pointerId;

                if (STATE.mode === 'eraser') {
                    zone.eraserCursor = world;
                    Edit.erase(world, zone);
                } else {
                    zone.current = { color: STATE.color, size: STATE.size, points: [world] };
                    Render.request(zone);
                }
            } else if (e.pointerType === 'touch') {
                const touches = [...zone.pointers.values()].filter(p => p.pointerType === 'touch');
                if (touches.length >= 2) {
                    zone.isDrawing = false;
                    zone.touchStart = zone.eraserCursor = null;
                    zone.pinchDist = Utils.dist(touches[0].clientX, touches[0].clientY, touches[1].clientX, touches[1].clientY);
                    zone.pinchScale = zone.scale;
                    zone.pinchCenter = { x: (touches[0].clientX + touches[1].clientX) / 2, y: (touches[0].clientY + touches[1].clientY) / 2 };
                    zone.pinchOffset = { x: zone.offsetX, y: zone.offsetY };
                } else if (!zone.isDrawing) {
                    zone.touchStart = { x: e.clientX, y: e.clientY, id: e.pointerId };
                }
            }
        });

        // 【極速平滑變形核心】
        el.addEventListener('pointermove', (e) => {
            if (!zone.pointers.has(e.pointerId)) return;
            zone.pointers.set(e.pointerId, e);

            if (zone.isDrawing && (e.pointerId === zone.drawingId || e.pointerType === 'pen')) {
                const world = Utils.screenToWorld(e.clientX, e.clientY, zone);
                if (STATE.mode === 'eraser') {
                    zone.eraserCursor = world;
                    Edit.erase(world, zone);
                } else if (zone.current) {
                    const last = zone.current.points[zone.current.points.length - 1];
                    // 略微放寬取樣距離（從原先 1.2px 調至 0.8px 提高精細度，配合 rAF 鎖不怕卡頓）
                    if (Utils.dist(world.x, world.y, last.x, last.y) >= 0.8) {
                        zone.current.points.push(world);
                        Render.request(zone);
                    }
                }
            } else {
                const touches = [...zone.pointers.values()].filter(p => p.pointerType === 'touch');

                // 雙指平移縮放邏輯調優
                if (touches.length >= 2 && !zone.isDrawing) {
                    const dist = Utils.dist(touches[0].clientX, touches[0].clientY, touches[1].clientX, touches[1].clientY);
                    let newScale = zone.pinchScale * (dist / (zone.pinchDist || 1));
                    newScale = Math.max(0.15, Math.min(10, newScale)); // 擴大縮放範圍

                    const center = { x: (touches[0].clientX + touches[1].clientX) / 2, y: (touches[0].clientY + touches[1].clientY) / 2 };
                    const rect = zone.canvas.getBoundingClientRect();
                    const originX = (zone.pinchCenter.x - rect.left - zone.pinchOffset.x) / zone.pinchScale;
                    const originY = (zone.pinchCenter.y - rect.top - zone.pinchOffset.y) / zone.pinchScale;

                    zone.scale = newScale;
                    zone.offsetX = center.x - rect.left - originX * zone.scale;
                    zone.offsetY = center.y - rect.top - originY * zone.scale;

                    // 寫入高效能非同步節流隊列
                    Render.request(zone);
                } else if (e.pointerType === 'touch' && touches.length === 1 && !zone.isDrawing && zone.touchStart?.id === e.pointerId) {
                    if (Utils.dist(e.clientX, e.clientY, zone.touchStart.x, zone.touchStart.y) >= 8) {
                        el.setPointerCapture(e.pointerId);
                        zone.isDrawing = true;
                        zone.drawingId = e.pointerId;

                        const start = Utils.screenToWorld(zone.touchStart.x, zone.touchStart.y, zone);
                        const current = Utils.screenToWorld(e.clientX, e.clientY, zone);
                        if (STATE.mode === 'eraser') {
                            zone.eraserCursor = current;
                            Edit.erase(current, zone);
                        } else {
                            zone.current = { color: STATE.color, size: STATE.size, points: [start, current] };
                        }
                        zone.touchStart = null;
                        Render.request(zone);
                    }
                }
            }
        });

        const handlePointerUp = (e) => {
            if (zone.pointers.has(e.pointerId)) {
                el.releasePointerCapture(e.pointerId);
                zone.pointers.delete(e.pointerId);
            }
            if (zone.isDrawing && e.pointerId === zone.drawingId) {
                Edit.finish(zone);
                zone.isDrawing = zone.drawingId = null;
            }
            if (zone.touchStart?.id === e.pointerId) {
                if (STATE.mode === 'eraser') Edit.erase(Utils.screenToWorld(zone.touchStart.x, zone.touchStart.y, zone), zone);
                zone.touchStart = null;
            }
            if (!zone.pointers.size) {
                zone.isDrawing = zone.drawingId = zone.touchStart = zone.eraserCursor = null;
            }
            Render.request(zone);
        };

        el.addEventListener('pointerup', handlePointerUp);
        el.addEventListener('pointercancel', handlePointerUp);
    }

    function bindEvents() {
        DOM.penBtn.onclick = () => {
            STATE.mode = 'pen';
            DOM.penBtn.classList.add('active');
            DOM.eraserBtn.classList.remove('active');
        };

        DOM.eraserBtn.onclick = () => {
            STATE.mode = 'eraser';
            DOM.eraserBtn.classList.add('active');
            DOM.penBtn.classList.remove('active');
        };

        DOM.sizeBtn.onclick = () => STATE.popupVisible ? UI.hideSizePopup() : UI.showSizePopup();

        // 給動作按鈕添加微反饋
        const actionBtns = [DOM.undoBtn, DOM.redoBtn, DOM.centerBtn, DOM.clearBtn];
        actionBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.add('clicking');
                setTimeout(() => btn.classList.remove('clicking'), 180);
            });
        });

        DOM.undoBtn.onclick = Edit.undo;
        DOM.redoBtn.onclick = Edit.redo;
        DOM.centerBtn.onclick = Edit.center;
        DOM.clearBtn.onclick = Edit.clear;

        DOM.minimizeBtn.onclick = () => window.AndroidBridge?.minimizeApp?.(true);
        DOM.closeBtn.onclick = () => window.AndroidBridge?.closeApp?.();

        DOM.sizeSlider.addEventListener('input', (e) => UI.updateSize(parseInt(e.target.value)));

        document.querySelectorAll('#group-colors .color').forEach((el) => {
            el.addEventListener('click', () => {
                UI.hideSizePopup();
                STATE.mode = 'pen';
                DOM.penBtn.classList.add('active');
                DOM.eraserBtn.classList.remove('active');

                document.querySelectorAll('#group-colors .color').forEach((c) => c.classList.remove('active'));
                el.classList.add('active');
                STATE.color = el.getAttribute('data-color');
            });
        });

        DOM.resizerBar.addEventListener('pointerdown', (e) => {
            if (!e.isPrimary) return;
            Utils.resetAllStates();
            DOM.resizerBar.classList.add('active-drag');
            DOM.resizerBar.setPointerCapture(e.pointerId);
        });

        DOM.resizerBar.addEventListener('pointermove', (e) => {
            if (!DOM.resizerBar.classList.contains('active-drag')) return;
            STATE.ratio = Math.max(0.2, Math.min(0.8, e.clientY / window.innerHeight));
            UI.resizeCanvas();
        });

        ['pointerup', 'pointercancel'].forEach((evt) => {
            DOM.resizerBar.addEventListener(evt, (e) => {
                DOM.resizerBar.classList.remove('active-drag');
                DOM.resizerBar.releasePointerCapture(e.pointerId);
            });
        });

        DOM.resizerBar.addEventListener('dblclick', () => {
            STATE.ratio = 0.618;
            UI.resizeCanvas();
        });

        document.addEventListener('click', (e) => {
            if (STATE.popupVisible && !DOM.sizePopup.contains(e.target) && !DOM.sizeBtn.contains(e.target)) {
                UI.hideSizePopup();
            }
        });
        DOM.sizePopup.addEventListener('pointerdown', (e) => e.stopPropagation());

        // 工具栏拖拽
        document.addEventListener('pointerdown', (e) => {
            const handle = e.target.closest('.drag-handle');
            if (!handle) return;
            const group = handle.closest('.group');
            if (!group) return;

            DRAG.isDragging = true;
            DRAG.group = group;
            DRAG.startX = e.clientX;
            DRAG.pointerId = e.pointerId;
            DRAG.moved = false;
            group.classList.add('dragging');
            handle.setPointerCapture(e.pointerId);
        }, true);

        document.addEventListener('pointermove', (e) => {
            if (!DRAG.isDragging || !DRAG.group || e.pointerId !== DRAG.pointerId) return;
            const deltaX = e.clientX - DRAG.startX;
            if (!DRAG.moved && Math.abs(deltaX) < 5) return;
            DRAG.moved = true;

            const groups = [...DOM.mainToolbar.querySelectorAll('.group')];
            for (const g of groups) {
                if (g === DRAG.group) continue;
                const rect = g.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right) {
                    g.parentNode.insertBefore(DRAG.group, e.clientX < rect.left + rect.width / 2 ? g : g.nextSibling);
                    break;
                }
            }
        }, true);

        document.addEventListener('pointerup', (e) => {
            if (!DRAG.isDragging || e.pointerId !== DRAG.pointerId) return;
            if (DRAG.group) DRAG.group.classList.remove('dragging');
            DRAG.group?.querySelector('.drag-handle')?.releasePointerCapture(e.pointerId);
            Object.assign(DRAG, { isDragging: false, group: null, moved: false });
        }, true);
    }

    window.switchActiveZone = (zoneId) => {
        if (STATE.activeZone === zoneId) return;
        STATE.activeZone = zoneId;
        document.querySelectorAll('.zone-viewport').forEach((el) => el.classList.remove('active'));
        document.getElementById(`zone-${zoneId}`).classList.add('active');
    };

    window.onAppMaximized = () => {
        Utils.resetAllStates();
        setTimeout(UI.resizeCanvas, 60);
    };

    window.addEventListener('resize', UI.resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(UI.resizeCanvas, 200));

    CONFIG.ZONE_IDS.forEach((id) => setupCanvasEvents(ZONES[id]));
    bindEvents();
    UI.updateSize(0);
    UI.resizeCanvas();
</script>
</body>
</html>
